{% extends 'base.html' %}


{% block موفقیت %}
    
{% endblock موفقیت %}



{% block body %}
    {% if messages %}
    <script src="{% static 'js/toastify.min.js' %}"></script>
      <script>
        {% for message in messages %}
            Toastify({
              text: "{{ message }}",
              duration: 3500,
              gravity: "top",
              position: "right",
              backgroundColor: {% if message.tags == 'success' %}"#00920c"
              {% elif message.tags == 'info' %}"#0081cc"
              {% elif message.tags == 'warning' %}"#ce7e15"
              {% elif message.tags == 'error' %}"#c50000"
              {% endif %},
          }).showToast();
        {% endfor %}
      </script>
    {% endif %}
        <div class="login-wrapper d-flex align-items-center justify-content-center text-center">               
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-10 col-lg-8">
            <div class="success-check"><i class="fa-solid fa-envelope-circle-check"></i></div>
            <!-- Reset Password Message-->
            <p class="text-white mt-4 mb-4">تا لحظاتی دیگر ایمیل بازیابی کلمه عبور برای شما ارسال می شود</p>
            <!-- Go Back Button--><a class="btn btn-warning" href="{% url 'home_module:home_page' %}">به خانه برو</a>
          </div>
        </div>
      </div>
    </div>
{% endblock body %}
