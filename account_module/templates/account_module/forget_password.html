{% extends 'base.html' %}
{% load static %}


{% block title %}
    فراموشی کلمه عبور
{% endblock title %}
   


{% block body %}
{% if messages %}
  <script src="{% static 'js/sweetalert2.all.min.js' %}"></script>
  <script>
    {% for message in messages %}
      Swal.fire({
        icon: "{{ message.tags }}",
        title: "{{ message }}",
        timer: 3500,
        timerProgressBar: true,
        //position:'top-left'
      });
    {% endfor %}
  </script>
{% endif %}
        <!-- Login Wrapper Area-->
    <div class="login-wrapper d-flex align-items-center justify-content-center text-center">               
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-10 col-lg-8"><img class="big-logo" src="{% static 'img/core-img/logo-white.png' %}" alt="">
            <!-- Register Form-->
            <div class="register-form mt-5">
              <form action="{% url 'account_module:forget_password_page' %}" method="POST">
                <div class="form-group text-start mb-4"><span>ایمیل</span>
                  <label for="email"><i class="fa-solid fa-user"></i></label>
                  <input class="form-control" id="email" name="email" type="text" placeholder="help@example.com">
                </div>
                {% csrf_token %}
                <button class="btn btn-warning btn-lg w-100" type="submit">بازنشانی رمز عبور</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
{% endblock body %}
