{% extends 'base.html' %}


{% block title %}
    تغییر کلمه عبور
{% endblock title %}
    


{% block body %}
        <div class="page-content-wrapper">
      <div class="container">
        <div class="profile-wrapper-area py-3">
          <!-- User Information-->
          <div class="card user-info-card">
            <div class="card-body p-4 d-flex align-items-center">
              <div class="user-profile me-3"><img src="img/bg-img/9.jpg" alt=""></div>
              <div class="user-info">
                <p class="mb-0 text-dark">@designing-world</p>
                <h5 class="mb-0">سوها جانات</h5>
              </div>
            </div>
          </div>
          <!-- User Meta Data-->
          <div class="card user-data-card">
            <div class="card-body">
              <form action="#" method="">
                <div class="mb-3">
                  <div class="title mb-2"><i class="fa-solid fa-key"></i><span>رمز عبور قدیمی</span></div>
                  <input class="form-control" type="password">
                </div>
                <div class="mb-3">
                  <div class="title mb-2"><i class="fa-solid fa-key"></i><span>رمز عبور جدید</span></div>
                  <input class="input-psswd form-control" id="registerPassword" type="password" placeholder="کلمه عبور">
                </div>
                <div class="mb-3">
                  <div class="title mb-2"><i class="fa-solid fa-key"></i><span>رمزعبور جدید را تکرار کنید</span></div>
                  <input class="form-control" type="password">
                </div>
                <button class="btn btn-success w-100" type="submit">رمزعبور را به روز کنید</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
{% endblock body %}
