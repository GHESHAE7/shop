{% extends 'base.html' %}
{% load static %}

{% block title %}
    ساخت حساب کاربری
{% endblock title %}

{% comment %} {% if messages %}
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
    {% for message in meesages %}
            Swal.fire({
            position: "top-end",
            icon: "{{ message.tags }}",
            title: "{{ message }}",
            showConfirmButton: false,
            timer: 1500
            });
    {% endfor %}
    </script>
{% endif %} {% endcomment %}

{% block body %}
        <!-- Login Wrapper Area-->
    <div class="login-wrapper d-flex align-items-center justify-content-center text-center">
      <!-- Background Shape-->
      <div class="background-shape"></div>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-10 col-lg-8"><img class="big-logo" src="{% static 'img/core-img/logo-white.png' %}" alt="">
            <!-- Register Form-->
            <div class="register-form mt-5">
              <form action="{% url 'account_module:register_page' %}" method="POST">
                <div class="form-group text-start mb-4"><span>نام کاربری</span>
                  <label for="username"><i class="fa-solid fa-user"></i></label>
                  <input class="form-control" id="username" type="text" name='username' placeholder="farhanazizi7">
                </div>
                <div class="form-group text-start mb-4"><span>پست الکترونیک</span>
                  <label for="email"><i class="fa-solid fa-at"></i></label>
                  <input class="form-control" id="email" type="email" name='email' placeholder="help@example.com">
                </div>
                <div class="form-group text-start mb-4"><span>کلمه عبور</span>
                  <label for="password"><i class="fa-solid fa-key"></i></label>
                  <input class="input-psswd form-control" id="registerPassword" name='password' type="password" placeholder="aaaa4444">
                </div>
                {% csrf_token %}
                <button class="btn btn-warning btn-lg w-100" type="submit">ثبت نام</button>
              </form>
            </div>
            <!-- Login Meta-->
            <div class="login-meta-data">
              <p class="mt-3 mb-0">در حال حاضر یک حساب کاربری دارید؟<a class="mx-1" href="{% url 'account_module:login_page' %}">ورود</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
{% endblock body %}
