{% extends 'base.html' %}



{% block title %}
    حفظ حریم خصوصی
{% endblock title %}
    


{% block body %}
    <!-- Header Area-->
    <div class="header-area" id="headerArea">
      <div class="container h-100 d-flex align-items-center justify-content-between rtl-flex-d-row-r">
        <!-- Back Button-->
        <div class="back-button me-2"><a href="{% url 'account_module:settings_page' %}"><i class="fa-solid fa-arrow-right-long"></i></a></div>
        <!-- Page Title-->
        <div class="page-heading">
          <h6 class="mb-0">سیاست حفظ حریم خصوصی</h6>
        </div>
        <!-- Navbar Toggler-->
        <div class="suha-navbar-toggler ms-2" data-bs-toggle="offcanvas" data-bs-target="#suhaOffcanvas" aria-controls="suhaOffcanvas">
          <div><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
    <div class="page-content-wrapper">
      <div class="container">
        <!-- Privacy Policy-->
        {% if privacy_policy %}
            <div class="privacy-policy-wrapper py-3">
            <h6>{{ privacy_policy.name }}</h6>
            <p>{{ privacy_policy.description }}</p>
            </div>
        {% else %}
        <div class="alert alert-warning">
            چیزی برای نمایش وجود ندارد
        </div>
        {% endif %}
      </div>
    </div>
{% endblock body %}
